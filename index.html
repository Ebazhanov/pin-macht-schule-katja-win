<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIN macht Schule – Fotogalerie</title>
    <style>
        /* Global Reset & Base Styles */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
            color: #333333;
            background-color: #f8f9fa;
            padding-bottom: 60px;
        }

        /* Header Section */
        .header {
            background-color: #0056b3;
            color: #ffffff;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 40px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .main-logo {
            max-width: 180px;
            height: auto;
            background: #ffffff;
            padding: 8px 16px;
            border-radius: 6px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .gallery-section {
            margin-bottom: 48px;
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #e9ecef;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        .section-title {
            font-size: 1.75rem;
            color: #0056b3;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 10px;
            margin-bottom: 24px;
        }

        .subsection-title {
            font-size: 1.2rem;
            color: #495057;
            margin: 24px 0 16px 0;
        }

        /* Responsive Photo Grid */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        /* Photo Cards */
        .photo-card {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .photo-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
        }

        .photo-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
        }

        .photo-card figcaption {
            padding: 12px;
            font-size: 0.875rem;
            font-weight: 500;
            color: #495057;
            text-align: center;
            background-color: #f8f9fa;
            border-top: 1px solid #f1f3f5;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Partner Section & Footer */
        .partner-section {
            text-align: center;
            padding: 32px 0 16px;
            border-top: 1px solid #e9ecef;
            margin-top: 40px;
        }

        .partner-logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 32px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .partner-logo {
            max-height: 48px;
            width: auto;
            object-fit: contain;
            filter: grayscale(20%);
            transition: filter 0.2s ease, transform 0.2s ease;
        }

        .partner-logo:hover {
            filter: grayscale(0%);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<!-- Site Header -->
<header class="header">
    <div class="header-content">
        <img src="photo/pin-logo.svg" alt="PIN Mail AG Logo" class="main-logo">
        <h1>PIN macht Schule</h1>
        <p>Auszeichnungen, Gewinnermotive und Fotogalerie der Schulwettbewerbe</p>
    </div>
</header>

<!-- Main Content -->
<main class="container">

    <!-- Section: Gewinner 2018 -->
    <section class="gallery-section">
        <h2 class="section-title">Wettbewerb 2018</h2>

        <h3 class="subsection-title">Gewinnermotive</h3>
        <div class="photo-grid">
            <figure class="photo-card">
                <img src="photo/pin_macht_schule_2018_gewinnermotive_klasse-1-2.jpg" alt="Gewinnermotiv Klasse 1-2 (2018)" loading="lazy">
                <figcaption>Klasse 1–2</figcaption>
            </figure>
            <figure class="photo-card">
                <img src="photo/pin_macht_schule_2018_gewinnermotive_klasse-3-4.jpg" alt="Gewinnermotiv Klasse 3-4 (2018)" loading="lazy">
                <figcaption>Klasse 3–4</figcaption>
            </figure>
            <figure class="photo-card">
                <img src="photo/pin_macht_schule_2018_gewinnermotive_klasse-5-6.jpg" alt="Gewinnermotiv Klasse 5-6 (2018)" loading="lazy">
                <figcaption>Klasse 5–6</figcaption>
            </figure>
            <figure class="photo-card">
                <img src="photo/pin_macht_schule_2018_gewinnermotive_edeka.jpg" alt="Sonderpreis EDEKA (2018)" loading="lazy">
                <figcaption>Sonderpreis EDEKA</figcaption>
            </figure>
            <figure class="photo-card">
                <img src="photo/pin_macht_schule_2018_gewinnermotive_tagesspiegel.jpg" alt="Sonderpreis Tagesspiegel (2018)" loading="lazy">
                <figcaption>Sonderpreis Tagesspiegel</figcaption>
            </figure>
        </div>

        <h3 class="subsection-title">Gewinnerklassen</h3>
        <div class="photo-grid">
            <figure class="photo-card">
                <img src="photo/pin-macht-schule-2018_gewinnerklasse-lommonsssow-grundschule-1.jpg" alt="Lomonossow-Grundschule Foto 1" loading="lazy">
                <figcaption>Lomonossow-Grundschule (Bild 1)</figcaption>
            </figure>
            <figure class="photo-card">
                <img src="photo/pin-macht-schule-2018_gewinnerklasse-lommonsssow-grundschule-2.jpg" alt="Lomonossow-Grundschule Foto 2" loading="lazy">
                <figcaption>Lomonossow-Grundschule (Bild 2)</figcaption>
            </figure>
            <figure class="photo-card">
                <img src="photo/pin-macht-schule-2018_gewinnerklasse-anna-seghers-schule.jpg" alt="Anna-Seghers-Schule" loading="lazy">
                <figcaption>Anna-Seghers-Schule</figcaption>
            </figure>
            <figure class="photo-card">
                <img src="photo/pin-macht-schule-2018_gewinnerklasse-grundschule-am-gutshof.jpg" alt="Grundschule am Gutshof" loading="lazy">
                <figcaption>Grundschule am Gutshof</figcaption>
            </figure>
            <figure class="photo-card">
                <img src="photo/pin-macht-schule-2018_gewinnerklasse-grundschule-im-beerwinkel.jpg" alt="Grundschule im Beerwinkel" loading="lazy">
                <figcaption>Grundschule im Beerwinkel</figcaption>
            </figure>
        </div>
    </section>

    <!-- Section: Gewinner 2017 -->
    <section class="gallery-section">
        <h2 class="section-title">Wettbewerb 2017</h2>
        <div class="photo-grid">
            <figure class="photo-card">
                <img src="photo/pin_macht_schule_gewinner_2017_klasse_1-2.jpg" alt="Gewinner 2017 Klasse 1-2" loading="lazy">
                <figcaption>Klasse 1–2</figcaption>
            </figure>
            <figure class="photo-card">
                <img src="photo/pin_macht_schule_gewinner_2017_klasse_3-4.jpg" alt="Gewinner 2017 Klasse 3-4" loading="lazy">
                <figcaption>Klasse 3–4</figcaption>
            </figure>
            <figure class="photo-card">
                <img src="photo/pin_macht_schule_gewinner_2017_klasse_5-6.jpg" alt="Gewinner 2017 Klasse 5-6" loading="lazy">
                <figcaption>Klasse 5–6</figcaption>
            </figure>
            <figure class="photo-card">
                <img src="photo/pin_macht_schule_gewinner_2017_tagesspiegel.jpg" alt="Tagesspiegel Sonderpreis 2017" loading="lazy">
                <figcaption>Tagesspiegel Sonderpreis</figcaption>
            </figure>
            <figure class="photo-card">
                <img src="photo/pin_macht_schule_gewinner_2017_tagesspiegel_0.jpg" alt="Tagesspiegel Gruppenfoto 2017" loading="lazy">
                <figcaption>Tagesspiegel Sonderpreis (Gruppe)</figcaption>
            </figure>
        </div>
    </section>

    <!-- Section: Weitere Gewinnerschulen -->
    <section class="gallery-section">
        <h2 class="section-title">Weitere Auszeichnungen & Schulen</h2>
        <div class="photo-grid">
            <figure class="photo-card">
                <img src="photo/pin-macht-schule_gewinner-alfredbrehmgrundschule_small.jpg" alt="Alfred-Brehm-Grundschule" loading="lazy">
                <figcaption>Alfred-Brehm-Grundschule</figcaption>
            </figure>
            <figure class="photo-card">
                <img src="photo/pin-macht-schule_gewinner-edeka_kiepertgrundschule_small.jpg" alt="Kiepert-Grundschule EDEKA Auszeichnung" loading="lazy">
                <figcaption>Kiepert-Grundschule</figcaption>
            </figure>
            <figure class="photo-card">
                <img src="photo/pin-macht-schule_gewinner-gsunterdenkastanien_small.jpg" alt="Grundschule Unter den Kastanien" loading="lazy">
                <figcaption>Grundschule Unter den Kastanien</figcaption>
            </figure>
            <figure class="photo-card">
                <img src="photo/pin-macht-schule_gewinner-heidegrundschule_small_0.jpg" alt="Heide-Grundschule" loading="lazy">
                <figcaption>Heide-Grundschule</figcaption>
            </figure>
        </div>
    </section>

    <!-- Partners Section -->
    <section class="partner-section">
        <h3 class="subsection-title">Partner & Unterstützer</h3>
        <div class="partner-logos">
            <img src="photo/ronaldmcdonald_logo.png" alt="Ronald McDonald Kinderhilfe Logo" class="partner-logo">
            <img src="photo/pin-logo.svg" alt="PIN AG Logo" class="partner-logo">
        </div>
    </section>

</main>

<!-- Optional Script import -->
<script src="util.js"></script>
</body>
</html>
